name: Disposable artifact transfer fixture
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [fixture, metadata-controls]
        default: fixture
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/probe
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_SUITE: ${{ inputs.suite }}
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-evidence
          path: evidence/
          retention-days: 3
